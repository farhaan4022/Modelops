apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm
  namespace: modelops
  labels:
    app: qwen-vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-vllm
  template:
    metadata:
      labels:
        app: qwen-vllm
    spec:
      nodeSelector:
        workload: gpu-inference
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen2.5-1.5B-Instruct
            - --revision
            - "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
            - --tokenizer-revision
            - "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
            - --dtype
            - auto
            - --max-model-len
            - "2048"
            - --max-num-seqs
            - "4"
            - --gpu-memory-utilization
            - "0.70"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: "6Gi"
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-vllm
  labels:
    app: qwen-vllm
  namespace: modelops
spec:
  type: ClusterIP
  selector:
    app: qwen-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http

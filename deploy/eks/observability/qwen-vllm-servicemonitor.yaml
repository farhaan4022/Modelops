apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qwen-vllm
  namespace: modelops
  labels:
    release: modelops-monitoring
spec:
  namespaceSelector:
    matchNames:
      - modelops
  selector:
    matchLabels:
      app: qwen-vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

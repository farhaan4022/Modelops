apiVersion: v1
data:
  modelops-gpu-dashboard.json: |
    {
      "uid": "modelops-gpu",
      "title": "ModelOps - EKS GPU Inference",
      "tags": ["modelops", "eks", "gpu", "vllm"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "GPU Utilization (%)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "percent", "min": 0, "max": 100},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_UTIL{namespace=\"modelops\",pod=~\"qwen-vllm.*\"}",
              "legendFormat": "{{modelName}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "GPU Framebuffer Used (MiB)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "none", "min": 0},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_FB_USED{namespace=\"modelops\",pod=~\"qwen-vllm.*\"}",
              "legendFormat": "GPU memory used"
            }
          ]
        },
        {
          "id": 3,
          "title": "GPU Temperature",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "celsius"},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_TEMP{namespace=\"modelops\",pod=~\"qwen-vllm.*\"}",
              "legendFormat": "{{modelName}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "vLLM Running Requests",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "short", "min": 0},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "vllm:num_requests_running",
              "legendFormat": "Running"
            }
          ]
        },
        {
          "id": 5,
          "title": "vLLM Waiting Requests",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "short", "min": 0},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "vllm:num_requests_waiting",
              "legendFormat": "Waiting"
            }
          ]
        },
        {
          "id": 6,
          "title": "Generated Tokens per Second",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "tokensps", "min": 0},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(vllm:generation_tokens_total[5m])",
              "legendFormat": "Output tokens/s"
            }
          ]
        },
        {
          "id": 7,
          "title": "P95 Time to First Token",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "s"},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "P95 TTFT"
            }
          ]
        },
        {
          "id": 8,
          "title": "Successful Requests per Second",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 24, "w": 12, "h": 8},
          "fieldConfig": {
            "defaults": {"unit": "reqps", "min": 0},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vllm:request_success_total[5m]))",
              "legendFormat": "Requests/s"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: modelops-gpu-dashboard
  namespace: gpu-monitoring

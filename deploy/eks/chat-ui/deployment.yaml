apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelops-chat-ui
  labels:
    app: modelops-chat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelops-chat-ui
  template:
    metadata:
      labels:
        app: modelops-chat-ui
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: ui-files
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: ui-files
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: ui-files
          configMap:
            name: modelops-chat-ui-files
---
apiVersion: v1
kind: Service
metadata:
  name: modelops-chat-ui
  labels:
    app: modelops-chat-ui
spec:
  type: ClusterIP
  selector:
    app: modelops-chat-ui
  ports:
    - name: http
      port: 80
      targetPort: http

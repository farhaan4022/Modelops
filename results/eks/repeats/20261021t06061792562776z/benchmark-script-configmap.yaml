    #!/usr/bin/env python3
    """ModelOps: streaming vLLM benchmark with per-request CSV results."""

    import argparse
    import concurrent.futures
    import csv
    import json
    import math
    import statistics
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import Path

    MODEL = "Qwen/Qwen2.5-1.5B-Instruct"

    FIELDS = [
        "concurrency", "request_id", "success",
        "latency_s", "ttft_s", "tpot_s",
        "output_tokens", "error",
    ]

    def percentile(values, fraction):
        ordered = sorted(values)
        return ordered[max(0, math.ceil(len(ordered) * fraction) - 1)]

    def fetch_metrics(base_url):
        with urllib.request.urlopen(
            base_url + "/metrics", timeout=3
        ) as response:
            lines = response.read().decode().splitlines()

        values = {}
        names = {
            "vllm:num_requests_running": "running",
            "vllm:num_requests_waiting": "waiting",
        }

        for line in lines:
            if not line or line.startswith("#"):
                continue

            for metric, label in names.items():
                if line.startswith(metric + "{") or line.startswith(metric + " "):
                    try:
                        values[label] = values.get(label, 0) + float(
                            line.split()[-1]
                        )
                    except ValueError:
                        pass

        return values

    def send_request(base_url, concurrency, request_id, max_tokens):
        # Unique request IDs reduce exact-prefix reuse.
        prompt = (
            f"Experiment request {concurrency}-{request_id}. "
            "Explain how GPU inference engines handle batching, "
            "memory management, scheduling, and performance tradeoffs."
        )

        payload = json.dumps({
            "model": MODEL,
            "messages": [{"role": "user", "content": prompt}],
            "temperature": 0,
            "max_tokens": max_tokens,
            "stream": True,
            "stream_options": {"include_usage": True},
        }).encode()

        request = urllib.request.Request(
            base_url + "/v1/chat/completions",
            data=payload,
            headers={"Content-Type": "application/json"},
        )

        started = time.perf_counter()
        first_token = None
        output_tokens = 0
        received_done = False

        result = {
            "concurrency": concurrency,
            "request_id": request_id,
            "success": False,
            "latency_s": "",
            "ttft_s": "",
            "tpot_s": "",
            "output_tokens": 0,
            "error": "",
        }

        try:
            with urllib.request.urlopen(request, timeout=120) as response:
                for raw_line in response:
                    line = raw_line.decode("utf-8").strip()

                    if not line.startswith("data: "):
                        continue

                    content = line[6:]

                    if content == "[DONE]":
                        received_done = True
                        break

                    event = json.loads(content)

                    for choice in event.get("choices", []):
                        delta = choice.get("delta") or {}
                        if delta.get("content") and first_token is None:
                            first_token = time.perf_counter() - started

                    usage = event.get("usage")
                    if usage is not None:
                        output_tokens = int(usage.get("completion_tokens", 0))

            elapsed = time.perf_counter() - started

            if not received_done or first_token is None or output_tokens == 0:
                raise RuntimeError("Incomplete streaming response")

            result.update({
                "success": True,
                "latency_s": round(elapsed, 6),
                "ttft_s": round(first_token, 6),
                "tpot_s": (
                    round((elapsed - first_token) / (output_tokens - 1), 6)
                    if output_tokens > 1 else ""
                ),
                "output_tokens": output_tokens,
            })

        except Exception as error:
            result["latency_s"] = round(
                time.perf_counter() - started, 6
            )
            result["error"] = str(error)

        return result

    def main():
        parser = argparse.ArgumentParser()
        parser.add_argument(
            "--url", default="http://127.0.0.1:8000"
        )
        parser.add_argument(
            "--concurrency", type=int, nargs="+", default=[1, 4, 8, 16]
        )
        parser.add_argument(
            "--requests", type=int, default=24
        )
        parser.add_argument(
            "--max-tokens", type=int, default=96
        )
        parser.add_argument(
            "--output", default="results/ec2"
        )
        args = parser.parse_args()

        if args.requests < 1 or args.max_tokens < 2:
            parser.error("Requests must be >= 1 and max-tokens >= 2")

        if any(value < 1 for value in args.concurrency):
            parser.error("Concurrency values must be >= 1")

        base_url = args.url.rstrip("/")
        output = Path(args.output)
        output.mkdir(parents=True, exist_ok=True)

        with urllib.request.urlopen(
            base_url + "/health", timeout=5
        ):
            print("vLLM health: OK", flush=True)

        timestamp = datetime.now(timezone.utc).strftime(
            "%Y%m%dT%H%M%SZ"
        )

        request_rows = []
        metric_rows = []
        summary_rows = []

        print("ModelOps streaming benchmark")
        print("Concurrency:", args.concurrency)
        print("Requests per level:", args.requests)
        print("Max output tokens:", args.max_tokens)
        print()

        for concurrency in args.concurrency:
            # One unmeasured warm-up request.
            warmup = send_request(
                base_url, concurrency, -1, args.max_tokens
            )

            if not warmup["success"]:
                raise RuntimeError(
                    f"Warm-up failed: {warmup['error']}"
                )

            stop = threading.Event()

            def monitor():
                while not stop.is_set():
                    try:
                        metrics = fetch_metrics(base_url)
                        metric_rows.append({
                            "concurrency": concurrency,
                            "elapsed_s": round(
                                time.perf_counter() - start, 6
                            ),
                            "running": metrics.get("running", ""),
                            "waiting": metrics.get("waiting", ""),
                        })
                    except Exception:
                        pass

                    stop.wait(0.1)

            start = time.perf_counter()
            thread = threading.Thread(target=monitor, daemon=True)
            thread.start()

            try:
                with concurrent.futures.ThreadPoolExecutor(
                    max_workers=concurrency
                ) as executor:
                    rows = list(executor.map(
                        lambda i: send_request(
                            base_url, concurrency, i, args.max_tokens
                        ),
                        range(args.requests),
                    ))
            finally:
                stop.set()
                thread.join(timeout=5)

            duration = time.perf_counter() - start
            request_rows.extend(rows)
            good = [row for row in rows if row["success"]]
            samples = [
                row for row in metric_rows
                if row["concurrency"] == concurrency
            ]

            summary = {
                "concurrency": concurrency,
                "requests": args.requests,
                "successful": len(good),
                "failed": len(rows) - len(good),
                "duration_s": round(duration, 3),
                "requests_per_s": round(len(good) / duration, 3),
                "output_tokens_per_s": round(
                    sum(row["output_tokens"] for row in good) / duration, 3
                ),
                "mean_latency_s": round(
                    statistics.mean(row["latency_s"] for row in good), 3
                ) if good else "",
                "p95_latency_s": round(
                    percentile([row["latency_s"] for row in good], 0.95), 3
                ) if good else "",
                "mean_ttft_s": round(
                    statistics.mean(row["ttft_s"] for row in good), 3
                ) if good else "",
                "p95_ttft_s": round(
                    percentile([row["ttft_s"] for row in good], 0.95), 3
                ) if good else "",
                "peak_running": max(
                    (row["running"] for row in samples
                     if row["running"] != ""), default=""
                ),
                "peak_waiting": max(
                    (row["waiting"] for row in samples
                     if row["waiting"] != ""), default=""
                ),
            }

            summary_rows.append(summary)

            print(
                f"C={concurrency:2d} | "
                f"Success={len(good)}/{args.requests} | "
                f"Throughput={summary['output_tokens_per_s']} tok/s | "
                f"Mean TTFT={summary['mean_ttft_s']}s | "
                f"Peak waiting={summary['peak_waiting']}",
                flush=True,
            )

        outputs = [
            (f"{timestamp}-requests.csv", request_rows, FIELDS),
            (
                f"{timestamp}-metrics.csv",
                metric_rows,
                ["concurrency", "elapsed_s", "running", "waiting"],
            ),
            (
                f"{timestamp}-summary.csv",
                summary_rows,
                list(summary_rows[0].keys()),
            ),
        ]

        for filename, rows, fieldnames in outputs:
            path = output / filename
            with path.open("w", newline="") as file:
                writer = csv.DictWriter(file, fieldnames=fieldnames)
                writer.writeheader()
                writer.writerows(rows)

            print("Saved:", path)

    if __name__ == "__main__":
        main()
